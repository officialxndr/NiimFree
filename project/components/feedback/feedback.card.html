<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 22px; background: var(--bg); }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; }
  .rowwrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { StatusPill, Banner, Toast, EmptyState, Button } = window.NiimFreeDesignSystem_8ff8e4;
    function Demo() {
      return (
        <div>
          <p className="lbl">Status pills</p>
          <div className="rowwrap">
            <StatusPill status="ready">Ready</StatusPill>
            <StatusPill status="warning">Lid open</StatusPill>
            <StatusPill status="danger">Disconnected</StatusPill>
            <StatusPill>Not connected</StatusPill>
            <Toast>Saved</Toast>
            <Toast icon="bluetooth">40×30 label detected</Toast>
          </div>
          <div className="cols">
            <div>
              <p className="lbl">Banners</p>
              <div className="stack">
                <Banner variant="success" icon="check-circle-2" title="40×30 label detected" />
                <Banner variant="warning" icon="alert-triangle" title="Size mismatch"
                  action={<Button size="sm" variant="secondary">Override</Button>}>
                  Design is 50×30 but a 40×30 label is loaded.
                </Banner>
                <Banner variant="accent" icon="sparkles" title="Template mode" >
                  Toggle fields editable in the inspector.
                </Banner>
              </div>
            </div>
            <div>
              <p className="lbl">Empty state</p>
              <div className="nf-card" style={{padding:0}}>
                <EmptyState icon="tags" title="No labels yet"
                  text="Create your first one — connect a printer and start designing."
                  action={<Button icon="plus" size="sm">New label</Button>} />
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
