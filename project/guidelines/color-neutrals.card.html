<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals & surfaces" subtitle="Backgrounds, surfaces, borders and text ramp (light)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 600; color: var(--text); margin-top: 6px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--bg);"></div><div class="name">bg</div><div class="hex">#F7F8FA</div></div>
    <div class="sw"><div class="chip" style="background: var(--surface);"></div><div class="name">surface</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background: var(--surface-alt);"></div><div class="name">surface-alt</div><div class="hex">#EFF1F4</div></div>
    <div class="sw"><div class="chip" style="background: var(--border);"></div><div class="name">border</div><div class="hex">#E2E5EA</div></div>
    <div class="sw"><div class="chip" style="background: var(--text-faint);"></div><div class="name">text-faint</div><div class="hex">#9098A3</div></div>
    <div class="sw"><div class="chip" style="background: var(--text-muted);"></div><div class="name">text-muted</div><div class="hex">#5C6470</div></div>
    <div class="sw"><div class="chip" style="background: var(--text);"></div><div class="name">text</div><div class="hex">#15181E</div></div>
  </div>
</body>
</html>
