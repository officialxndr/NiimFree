<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 22px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px;
          border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--border); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Icon } = window.NiimFreeDesignSystem_8ff8e4;
    const names = ["tags","layout-grid","printer","settings","plus","bluetooth","qr-code","calendar",
                   "type","shapes","barcode","image","battery-medium","lock","check-circle-2","more-horizontal"];
    function Demo() {
      return (
        <div className="grid">
          {names.map(n => (
            <div className="cell" key={n}>
              <Icon name={n} size={24} color="var(--text)" />
              <span className="nm">{n}</span>
            </div>
          ))}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
