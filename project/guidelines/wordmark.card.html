<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="NiimFree lockup — tag glyph + Inter Bold wordmark, on light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; display: flex; }
  .half { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .light { background: var(--bg); }
  .dark { background: var(--gray-50); }
  .glyph { width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
           background: var(--primary); box-shadow: var(--shadow-fab); }
  .glyph i { width: 26px; height: 26px; color: #fff; }
  .word { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .word .free { color: var(--primary); }
</style>
</head>
<body>
  <div class="half light">
    <div class="glyph"><i data-lucide="tag"></i></div>
    <div class="word" style="color: var(--text);">Niim<span class="free">Free</span></div>
  </div>
  <div class="half dark" data-theme="dark">
    <div class="glyph"><i data-lucide="tag"></i></div>
    <div class="word" style="color: var(--gray-900);">Niim<span class="free">Free</span></div>
  </div>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
