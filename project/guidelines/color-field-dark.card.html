<!-- @dsCard group="Colors" viewport="700x150" name="Field highlight & dark surfaces" subtitle="Editable template fields, plus a peek at the dark theme" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; display: flex; gap: 16px; }
  .panel { flex: 1; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 14px; }
  .label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }
  .field { display: inline-block; background: var(--field-highlight); color: var(--text); border: 1px dashed var(--accent);
           border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .dark { background: var(--gray-50); color: var(--gray-900); }
  .drow { display: flex; gap: 8px; }
  .dsw { flex: 1; height: 30px; border-radius: 8px; border: 1px solid var(--gray-200); }
</style>
</head>
<body>
  <div class="panel">
    <div class="label">Editable field highlight · --field-highlight</div>
    <span class="field">Use by &nbsp;Jun 12</span>
  </div>
  <div class="panel dark" data-theme="dark">
    <div class="label" style="color: var(--gray-500);">Dark theme surfaces</div>
    <div class="drow">
      <div class="dsw" style="background: var(--bg);"></div>
      <div class="dsw" style="background: var(--surface);"></div>
      <div class="dsw" style="background: var(--surface-alt);"></div>
      <div class="dsw" style="background: var(--primary);"></div>
      <div class="dsw" style="background: var(--accent);"></div>
      <div class="dsw" style="background: var(--success);"></div>
    </div>
  </div>
</body>
</html>
